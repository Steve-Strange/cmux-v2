name: build desktop release

on:
  workflow_call:
    inputs:
      version:
        description: Four-part Chromium/cmux version.
        required: true
        type: string
      channel:
        description: stable or nightly.
        required: true
        type: string
      release_tag:
        description: GitHub release tag that owns the update assets.
        required: true
        type: string
    secrets:
      CMUX_UPDATE_PRIVATE_KEY_B64:
        required: true
      CMUX_RELEASE_REPO_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      WINDOWS_SIGNING_CERTIFICATE_B64:
        required: true
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CMUX_DISTRIBUTION_REPOSITORY: manaflow-ai/cmux-v2

concurrency:
  group: cmux-${{ inputs.channel }}-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        env:
          CMUX_VERSION: ${{ inputs.version }}
          CMUX_CHANNEL: ${{ inputs.channel }}
          CMUX_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys
          sys.path.insert(0, "scripts")
          from release_version import parse_version, read_pinned_version

          requested = parse_version(os.environ["CMUX_VERSION"])
          pinned = read_pinned_version(Path.cwd())
          assert requested[:3] == pinned[:3]
          assert requested[3] > pinned[3]
          channel = os.environ["CMUX_CHANNEL"]
          tag = os.environ["CMUX_RELEASE_TAG"]
          assert channel in {"stable", "nightly"}
          assert tag == (f"v{os.environ['CMUX_VERSION']}" if channel == "stable" else "nightly")
          PY

  linux-compile:
    needs: validate
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    env:
      CMUX_LINUX_BUILD_ROOT: /opt/cmux
      CHROMIUM_SRC: /opt/cmux/chromium/src
      CMUX_DEPOT_TOOLS: /opt/cmux/depot_tools
      CMUX_RELEASE_VERSION: ${{ inputs.version }}
      CMUX_RELEASE_CHANNEL: ${{ inputs.channel }}
      CMUX_RELEASE_SOURCE_SHA: ${{ github.sha }}
      CMUX_RELEASE_PHASE: all
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            clang \
            cmake \
            devscripts \
            dpkg-dev \
            fakeroot \
            file \
            gzip \
            pkg-config \
            rsync \
            xz-utils
      - name: Mount revision-keyed Chromium build disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: cmux-browser-linux-${{ hashFiles('.chromium-version') }}
          path: /opt/cmux
      - name: Install cached Rust toolchain
        env:
          CARGO_HOME: /opt/cmux/cargo-home
          CMUX_RUST_TOOLCHAIN: "1.96.0"
          RUSTUP_HOME: /opt/cmux/rustup
        run: |
          set -euo pipefail
          rustup toolchain install "$CMUX_RUST_TOOLCHAIN" \
            --profile minimal \
            --no-self-update
          {
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "RUSTUP_TOOLCHAIN=$CMUX_RUST_TOOLCHAIN"
          } >> "$GITHUB_ENV"
      - name: Prepare pinned Linux release checkout
        run: ./scripts/bootstrap-release-linux.sh
      - name: Compile and package Linux x64 while preserving build cache
        id: linux_build
        run: |
          set +e
          ./scripts/build-release-linux.sh
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > linux-x64-exit-code
          if [ "$exit_code" -eq 0 ]; then
            echo 'package_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'package_ok=false' >> "$GITHUB_OUTPUT"
            echo "::error::Linux build/package exited with $exit_code; preserving its build disk before the gate fails"
          fi
      - name: Upload Linux debug symbols to Sentry
        id: sentry_upload
        if: ${{ steps.linux_build.outputs.package_ok == 'true' }}
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aurora-7k
          SENTRY_PROJECT: cmux-browser
        run: |
          set -euo pipefail
          cli="$(./scripts/ensure-sentry-cli.sh)"
          chromium_src="${CHROMIUM_SRC:-/opt/cmux/chromium/src}"
          symbols=("$chromium_src/out/Release/chrome")
          if [ -f "$chromium_src/out/Release/chrome_crashpad_handler" ]; then
            symbols+=("$chromium_src/out/Release/chrome_crashpad_handler")
          fi
          test -f "${symbols[0]}"
          "$cli" debug-files upload "${symbols[@]}"
      - name: Upload Linux x64 artifacts
        id: linux_artifact
        uses: actions/upload-artifact@v4
        if: ${{ steps.linux_build.outputs.package_ok == 'true' }}
        continue-on-error: true
        with:
          name: cmux-linux-x64
          path: |
            release/cmux-linux-x64-installer.run
            release/cmux-linux-x64.zip
            release/cmux-linux-x64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Record the downstream gate status
        if: ${{ always() }}
        continue-on-error: true
        env:
          SENTRY_OUTCOME: ${{ steps.sentry_upload.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.linux_artifact.outcome }}
        run: |
          build_exit_code="$(cat linux-x64-exit-code 2>/dev/null || printf 255)"
          {
            printf 'build_exit_code=%s\n' "$build_exit_code"
            printf 'sentry_outcome=%s\n' "$SENTRY_OUTCOME"
            printf 'artifact_outcome=%s\n' "$ARTIFACT_OUTCOME"
          } > linux-x64-gate-status
      - name: Upload Linux build/package status
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-status
          path: linux-x64-gate-status
          if-no-files-found: error
          retention-days: 14

  linux-x64:
    needs: [validate, linux-compile]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Download Linux build/package status
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-status
          path: status
      - name: Fail closed after the build disk is committed
        run: |
          set -euo pipefail
          status_file=status/linux-x64-gate-status
          exit_code="$(sed -n 's/^build_exit_code=//p' "$status_file")"
          sentry_outcome="$(sed -n 's/^sentry_outcome=//p' "$status_file")"
          artifact_outcome="$(sed -n 's/^artifact_outcome=//p' "$status_file")"
          [ "$exit_code" = 0 ] || {
            echo "Linux build/package failed with exit code $exit_code" >&2
            exit 1
          }
          [ "$sentry_outcome" = success ] || {
            echo "Linux Sentry symbol upload ended with $sentry_outcome" >&2
            exit 1
          }
          [ "$artifact_outcome" = success ] || {
            echo "Linux artifact upload ended with $artifact_outcome" >&2
            exit 1
          }
      - name: Download and verify Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: cmux-linux-x64
          path: release
      - run: |
          test -s release/cmux-linux-x64-installer.run
          test -s release/cmux-linux-x64.zip
          test -s release/cmux-linux-x64.deb

  source:
    needs: validate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      CMUX_RELEASE_VERSION: ${{ inputs.version }}
      CMUX_RELEASE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact corresponding source
        run: ./scripts/build-release-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-source
          path: |
            release/cmux-browser-source-*.tar.zst
            release/corresponding-source.json
          if-no-files-found: error
          retention-days: 14

  compliance:
    if: vars.CMUX_RELEASE_COMPLIANCE_READY == 'true'
    needs: validate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage the reviewed public-release inventory
        run: |
          set -euo pipefail
          test -s release-compliance/THIRD_PARTY_NOTICES.html
          test -s release-compliance/third-party-notices.spdx.json
          mkdir -p release
          cp release-compliance/THIRD_PARTY_NOTICES.html \
            release-compliance/third-party-notices.spdx.json \
            release/
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-compliance
          path: |
            release/THIRD_PARTY_NOTICES.html
            release/third-party-notices.spdx.json
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, cmux-release]
    timeout-minutes: 360
    env:
      CMUX_RELEASE_VERSION: ${{ inputs.version }}
      CMUX_RELEASE_CHANNEL: ${{ inputs.channel }}
      CMUX_HQ_BIN: ${{ vars.CMUX_HQ_BIN }}
      CMUX_SIGN_IDENTITY: ${{ vars.CMUX_MAC_SIGN_IDENTITY }}
      CMUX_SIGN_PROVISION_PROFILE: ${{ vars.CMUX_MAC_PROVISION_PROFILE }}
      CMUX_NOTARYTOOL_KEYCHAIN_PROFILE: ${{ vars.CMUX_MAC_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Build through HQ, sign, notarize, and package macOS arm64
        run: ./scripts/build-release-macos-hq.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-macos-arm64
          path: |
            release/cmux-macos-arm64.dmg
            release/cmux-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    needs: validate
    runs-on: [self-hosted, Windows, X64, cmux-release]
    timeout-minutes: 360
    env:
      CHROMIUM_SRC: ${{ vars.CMUX_WINDOWS_CHROMIUM_SRC }}
      CMUX_RELEASE_VERSION: ${{ inputs.version }}
      CMUX_RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Materialize Authenticode certificate
        shell: pwsh
        env:
          CERTIFICATE_B64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_B64 }}
        run: |
          if (-not $env:CERTIFICATE_B64) { throw 'WINDOWS_SIGNING_CERTIFICATE_B64 is empty' }
          $path = Join-Path $env:RUNNER_TEMP 'cmux-release-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_B64))
          "CMUX_WINDOWS_SIGNING_CERTIFICATE=$path" >> $env:GITHUB_ENV
      - name: Build, Authenticode-sign, and package Windows x64
        shell: pwsh
        env:
          CMUX_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/build-release-windows.ps1
      - name: Upload Windows debug symbols to Sentry
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aurora-7k
          SENTRY_PROJECT: cmux-browser
        run: |
          $cli = & ./scripts/ensure-sentry-cli.ps1
          $chromiumSrc = if ($env:CHROMIUM_SRC) {
            $env:CHROMIUM_SRC
          } else {
            'C:\cr\src'
          }
          $release = Join-Path $chromiumSrc 'out\Release'
          $requiredNames = @(
            'chrome.exe',
            'chrome.exe.pdb',
            'chrome.dll',
            'chrome.dll.pdb',
            'chrome_elf.dll',
            'chrome_elf.dll.pdb'
          )
          $requiredSymbols = @(
            $requiredNames | ForEach-Object { Join-Path $release $_ }
          )
          $missing = @(
            $requiredSymbols | Where-Object { -not (Test-Path -LiteralPath $_) }
          )
          if ($missing) {
            throw "Missing browser debug files: $($missing -join ', ')"
          }
          $optionalNames = @(
            'chrome_crashpad_handler.exe',
            'chrome_crashpad_handler.exe.pdb'
          )
          $optionalSymbols = @(
            $optionalNames |
              ForEach-Object { Join-Path $release $_ } |
              Where-Object { Test-Path -LiteralPath $_ }
          )
          $symbols = @($requiredSymbols + $optionalSymbols)
          & $cli debug-files upload @symbols
          if ($LASTEXITCODE -ne 0) { throw 'Sentry debug-file upload failed' }
      - name: Remove Authenticode certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:CMUX_WINDOWS_SIGNING_CERTIFICATE -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-windows-x64
          path: |
            release/cmux-windows-x64.zip
            release/cmux-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 14

  signed-feed:
    if: vars.CMUX_RELEASE_COMPLIANCE_READY == 'true'
    needs: [compliance, linux-x64, macos-arm64, source, windows-x64]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cmux-*
          path: release
          merge-multiple: true
      - name: Sign update manifest
        env:
          UPDATE_KEY_B64: ${{ secrets.CMUX_UPDATE_PRIVATE_KEY_B64 }}
          CMUX_VERSION: ${{ inputs.version }}
          CMUX_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [ -n "$UPDATE_KEY_B64" ] || { echo 'CMUX_UPDATE_PRIVATE_KEY_B64 is empty' >&2; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$UPDATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          python3 scripts/package-update.py \
            --version "$CMUX_VERSION" \
            --base-url "https://github.com/${CMUX_DISTRIBUTION_REPOSITORY}/releases/download/${CMUX_RELEASE_TAG}" \
            --private-key "$key" \
            --output release/update.json \
            --artifact mac-arm64=release/cmux-macos-arm64.zip,cmux-browser.app,Contents/MacOS/cmux \
            --artifact linux-x64=release/cmux-linux-x64.zip,cmux-browser,chrome \
            --artifact windows-x64=release/cmux-windows-x64.zip,cmux-browser,chrome.exe
      - name: Generate provenance and checksums
        env:
          CMUX_VERSION: ${{ inputs.version }}
          CMUX_CHANNEL: ${{ inputs.channel }}
          CMUX_RELEASE_TAG: ${{ inputs.release_tag }}
          CMUX_SOURCE_REPOSITORY: ${{ github.repository }}
          CMUX_SOURCE_SHA: ${{ github.sha }}
          CMUX_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source_archives=(release/cmux-browser-source-*.tar.zst)
          [ "${#source_archives[@]}" -eq 1 ]
          python3 scripts/generate-release-provenance.py \
            --version "$CMUX_VERSION" \
            --channel "$CMUX_CHANNEL" \
            --release-tag "$CMUX_RELEASE_TAG" \
            --source-repository "$CMUX_SOURCE_REPOSITORY" \
            --source-sha "$CMUX_SOURCE_SHA" \
            --run-url "$CMUX_RUN_URL" \
            --output release/provenance.intoto.jsonl \
            --subject release/cmux-macos-arm64.dmg \
            --subject release/cmux-macos-arm64.zip \
            --subject release/cmux-linux-x64-installer.run \
            --subject release/cmux-linux-x64.zip \
            --subject release/cmux-linux-x64.deb \
            --subject release/cmux-windows-x64.zip \
            --subject release/cmux-windows-x64-installer.exe \
            --subject "${source_archives[0]}" \
            --subject release/corresponding-source.json \
            --subject release/THIRD_PARTY_NOTICES.html \
            --subject release/third-party-notices.spdx.json \
            --subject release/update.json
          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum |
              sed 's#  \./#  #' > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-signed-feed
          path: |
            release/update.json
            release/SHA256SUMS
            release/provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 14

  publish:
    if: vars.CMUX_RELEASE_COMPLIANCE_READY == 'true'
    needs: [compliance, linux-x64, macos-arm64, source, windows-x64, signed-feed]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cmux-*
          path: release
          merge-multiple: true
      - name: Require the reviewed public-release inventory
        run: |
          set -euo pipefail
          test -f release/THIRD_PARTY_NOTICES.html
          test -f release/third-party-notices.spdx.json
          source_archives=(release/cmux-browser-source-*.tar.zst)
          [ "${#source_archives[@]}" -eq 1 ]
          grep -Fq "  THIRD_PARTY_NOTICES.html" release/SHA256SUMS
          grep -Fq "  third-party-notices.spdx.json" release/SHA256SUMS
          grep -Fq "  ${source_archives[0]#release/}" release/SHA256SUMS
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.CMUX_RELEASE_REPO_TOKEN }}
          CMUX_CHANNEL: ${{ inputs.channel }}
          CMUX_VERSION: ${{ inputs.version }}
          CMUX_RELEASE_TAG: ${{ inputs.release_tag }}
          CMUX_SOURCE_REPOSITORY: ${{ github.repository }}
          CMUX_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_url="https://github.com/${CMUX_SOURCE_REPOSITORY}/commit/${CMUX_SOURCE_SHA}"
          if ! gh release view "$CMUX_RELEASE_TAG" \
              --repo "$CMUX_DISTRIBUTION_REPOSITORY" >/dev/null 2>&1; then
            if [ "$CMUX_CHANNEL" = nightly ]; then
              gh release create "$CMUX_RELEASE_TAG" \
                --repo "$CMUX_DISTRIBUTION_REPOSITORY" \
                --target main --prerelease --title "cmux nightly $CMUX_VERSION" \
                --notes "Automated cmux Browser nightly $CMUX_VERSION from ${source_url}."
            else
              gh release create "$CMUX_RELEASE_TAG" \
                --repo "$CMUX_DISTRIBUTION_REPOSITORY" \
                --target main --title "cmux $CMUX_VERSION" \
                --notes "cmux Browser $CMUX_VERSION from ${source_url}."
            fi
          elif [ "$CMUX_CHANNEL" = nightly ]; then
            gh release edit "$CMUX_RELEASE_TAG" \
              --repo "$CMUX_DISTRIBUTION_REPOSITORY" \
              --prerelease --title "cmux nightly $CMUX_VERSION" \
              --notes "Automated cmux Browser nightly $CMUX_VERSION from ${source_url}."
          fi

          # Package assets land before update.json, so clients never observe a
          # new manifest that points at artifacts which have not uploaded yet.
          gh release upload "$CMUX_RELEASE_TAG" \
            --repo "$CMUX_DISTRIBUTION_REPOSITORY" --clobber \
            release/cmux-macos-arm64.dmg release/cmux-macos-arm64.zip \
            release/cmux-linux-x64-installer.run \
            release/cmux-linux-x64.zip release/cmux-linux-x64.deb \
            release/cmux-windows-x64.zip release/cmux-windows-x64-installer.exe \
            release/cmux-browser-source-*.tar.zst \
            release/corresponding-source.json \
            release/THIRD_PARTY_NOTICES.html \
            release/third-party-notices.spdx.json \
            release/provenance.intoto.jsonl release/SHA256SUMS
          gh release upload "$CMUX_RELEASE_TAG" \
            --repo "$CMUX_DISTRIBUTION_REPOSITORY" --clobber \
            release/update.json
          if [ "$CMUX_CHANNEL" != nightly ]; then
            gh release edit "$CMUX_RELEASE_TAG" \
              --repo "$CMUX_DISTRIBUTION_REPOSITORY" --latest
          fi
